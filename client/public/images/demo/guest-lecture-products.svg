      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid_guest_lecture_products_svg" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grad_guest_lecture_products_svg)"/>
  <rect width="600" height="400" fill="url(#grid_guest_lecture_products_svg)"/>
  
  <circle cx="500" cy="100" r="140" fill="white" opacity="0.05"/>
  <circle cx="80" cy="320" r="100" fill="white" opacity="0.04"/>

  <!-- Center Card -->
  <g transform="translate(40, 50)">
    <rect width="520" height="300" rx="16" fill="rgba(15,23,42,0.45)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <text x="260" y="90" font-size="54" text-anchor="middle">💡</text>
    <text x="260" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Building Tech Products</text>
    <text x="260" y="195" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle">From Campus Ideas to Scale</text>
    
    <rect x="200" y="225" width="120" height="30" rx="15" fill="rgba(255,255,255,0.15)"/>
    <text x="260" y="245" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEPARTMENT OF COMP</text>
  </g>
